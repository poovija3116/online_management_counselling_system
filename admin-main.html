<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Admin Portal - GCE Erode</title>

<link rel="stylesheet"
      href="admin-main.css">


</head>

<body>


<!-- HEADER -->

<header class="admin-header">

    <h1>
        GOVERNMENT COLLEGE OF ENGINEERING, ERODE-638316
    </h1>

    <h2>
        ACADEMIC SUPPORT CELL
    </h2>

    <div class="title-bar">
        ADMIN PORTAL
    </div>

</header>



<!-- MAIN CONTENT -->

<main class="admin-container">


    <!-- WELCOME -->

    <section class="welcome-section">

        <span>
            ADMINISTRATION & CONTROL CENTRE
        </span>

        <h2>
            Management Counselling 2026
        </h2>

        <p>
            Manage student information, counselling
            activities and seat availability.
        </p>

    </section>



    <!-- ADMIN BUTTONS -->

    <section class="admin-actions">


        <!-- 01 -->

        <button
            class="admin-button"
            onclick="window.location.href='admin-rank.html'">

            <span class="button-number">
                01
            </span>

            <div class="button-icon">
                ↕
            </div>

            <div class="button-content">

                <h3>
                    ADMIN RANK
                </h3>

                <p>
                    Manage student counselling rank
                </p>

            </div>

            <span class="arrow">
                →
            </span>

        </button>



        <!-- 02 -->

        <button
            class="admin-button"
            onclick="window.location.href='allotment-overview.html'">

            <span class="button-number">
                02
            </span>

            <div class="button-icon">
                ✎
            </div>

            <div class="button-content">

                <h3>
                    ALLOTMENT OVERVIEW
                </h3>

                <p>
                    Update counselling information
                </p>

            </div>

            <span class="arrow">
                →
            </span>

        </button>



        <!-- 03 -->

        <button
            class="admin-button"
            onclick="window.location.href='index.html'">

            <span class="button-number">
                03
            </span>

            <div class="button-icon">
                ▣
            </div>

            <div class="button-content">

                <h3>
                    SEAT AVAILABILITY
                </h3>

                <p>
                    View branch-wise seat details
                </p>

            </div>

            <span class="arrow">
                →
            </span>

        </button>



        <!-- 04 - STUDENT MANAGEMENT -->

        <button
            class="admin-button"
            type="button"
            onclick="window.location.href='admin-student-monitoring.html'">

            <span class="button-number">
                04
            </span>

            <div class="button-icon">
                👨‍🎓
            </div>

            <div class="button-content">

                <h3>
                    STUDENT MANAGEMENT
                </h3>

                <p>
                    View and manage student records
                </p>

            </div>

            <span class="arrow">
                →
            </span>

        </button>



        <!-- 05 -->

        <button
            class="admin-button"
            onclick="window.location.href='announcement.html'">

            <span class="button-number">
                05
            </span>

            <div class="button-icon">
                📄
            </div>

            <div class="button-content">

                <h3>
                    ANNOUNCEMENTS
                </h3>

                <p>
                    Create and manage announcements
                </p>

            </div>

            <span class="arrow">
                →
            </span>

        </button>


    </section>


</main>


</body>

</html>
