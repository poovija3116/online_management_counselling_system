<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Counsellor Portal - GCE Erode</title>

    <link
        rel="stylesheet"
        href="counseller-main.css">

</head>


<body>


    <!-- HEADER -->

    <header class="counsellor-header">

        <h1>
            GOVERNMENT COLLEGE OF ENGINEERING, ERODE-638316
        </h1>

        <h2>
            ACADEMIC SUPPORT CELL
        </h2>

        <div class="title-bar">
            COUNSELLOR PORTAL
        </div>

    </header>



    <!-- MAIN -->

    <main class="counsellor-container">


        <!-- WELCOME -->

        <section class="welcome-section">

            <span>
                COUNSELLING CONTROL
            </span>

            <h2>
                Management Counselling 2026
            </h2>

            <p>
                Control and manage the counselling process.
            </p>

        </section>



        <!-- NAVIGATION BUTTONS -->

        <section class="counsellor-actions">


            <!-- 01 - ROUND MANAGEMENT -->

            <button
                class="portal-button"
                type="button"
                onclick="window.location.href='round-management.html'">

                <span class="button-number">
                    01
                </span>

                <div class="button-icon">
                    ↻
                </div>

                <div class="button-content">

                    <h3>
                        ROUND MANAGEMENT
                    </h3>

                    <p>
                        Create and manage counselling rounds
                    </p>

                </div>

                <span class="arrow">
                    →
                </span>

            </button>



            <!-- 02 - COUNSELLOR DASHBOARD -->

            <button
                class="portal-button"
                type="button"
                onclick="window.location.href='counsellor-dashboard.html'">

                <span class="button-number">
                    02
                </span>

                <div class="button-icon">
                    ▣
                </div>

                <div class="button-content">

                    <h3>
                        COUNSELLOR DASHBOARD
                    </h3>

                    <p>
                        Monitor counselling activities and status
                    </p>

                </div>

                <span class="arrow">
                    →
                </span>

            </button>

            <!-- 03 - SEAT AVAILABILITY -->

<button
    class="portal-button"
    type="button"
    onclick="window.location.href='seat-availability.html'">

    <span class="button-number">
        03
    </span>

    <div class="button-icon">
        ▦
    </div>

    <div class="button-content">

        <h3>
            SEAT AVAILABILITY
        </h3>

        <p>
            View current department-wise seat availability
        </p>

    </div>

    <span class="arrow">
        →
    </span>

</button>

            <!-- 03 - STUDENT ALLOTMENT -->

            <button
                class="portal-button"
                type="button"
                onclick="window.location.href='allotment-overview.html'">

                <span class="button-number">
                    04
                </span>

                <div class="button-icon">
                    ✓
                </div>

                <div class="button-content">

                    <h3>
                        ALLOTMENT OVERVIEW
                    </h3>

                    <p>
                        View and manage student seat allotment
                    </p>

                </div>

                <span class="arrow">
                    →
                </span>

            </button>


        </section>


    </main>


</body>

</html>
